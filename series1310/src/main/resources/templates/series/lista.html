<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="utf-8">
		<title>Séries</title>
	</head>
	<body>
		<h1>Séries Cadastradas</h1>
		
		<table border="1">
			<thead>
				<tr>
					<th>Nome</th>
					<th>Plataforma</th>
					<th>Ano</th>
					<th>Genero</th>
				</tr>
			</thead>
			<tbody>
				<tr th:each="serie : ${series}">
					<td th:text="${serie.nome}"></td>
					<td th:text="${serie.plataforma}"></td>
					<td th:text="${serie.anoLancamento}"></td>
					<td th:text="${serie.genero}"></td>
					<td><a th:href="@{/paginas/series/{id}/editar(id=${serie.id})}">Editar</a>
					    <form th:action="@{|/paginas/series/${serie.id}/remover|}" method="post" style="display: inline; margin-left: 10px;">
							<button type="submit">Remover</button>
						</form>
					</td>
					
				</tr>
			</tbody>
		</table>
	</body>
</html>
