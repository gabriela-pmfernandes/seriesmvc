<!DOCTYPE html>
<html lang="pt-br" xmlns:th="http://www.thymeleaf.org">
	<head>
		<meta charset="utf-8">
		<title>Nova série</title>
		<link rel="stylesheet" href="/css/estilo.css">
	</head>
	<body>
		<h1>Nova série</h1>
		
		<form method="post" action="/paginas/series/nova" th:object="${serie}">
			
			<p>
				<label>Nome</label>
				<input type="text" th:field="*{nome}">
				<span th:errors="*{nome}"></span>
			</p>
			
			<p>
				<label>Ano lançamento</label>
				<input type="text" th:field="*{anoLancamento}">
				<span th:errors="*{anoLancamento}"></span>
			</p>
			
			<p>
				<label>Genero</label>
				<input type="text" th:field="*{genero}">
				<span th:errors="*{genero}"></span>
			</p>
			
			<p>
				<label>Plataforma</label>
				<input type="text" th:field="*{plataforma}">
				<span th:errors="*{plataforma}"></span>
			</p>
			
			<button type="submit">Cadastrar</button>
		</form>
	</body>
</html>
